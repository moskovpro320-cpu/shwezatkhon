<script>
/* v25: Service Worker မှတ်ပုံတင် + Auto-update
   - Cache အဟောင်းဖျက်တာကို sw.js (activate) က လုပ်ပေးပြီးသား → ဒီမှာ cache ကို မဖျက်တော့ (Offline fallback မပျက်စေရန်)
   - SW ဗားရှင်းအသစ်ရောက်ရင် (controllerchange) စာမျက်နှာကို တစ်ကြိမ်သာ reload
   - App ကို နောက်ခံကပြန်ဖွင့်တိုင်း (visibilitychange) update စစ် */
(function(){try{
 var auth=/[?&#](code|access_token|refresh_token|error|type)=/.test(location.search+location.hash);
 if("serviceWorker" in navigator){
  var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
   if(had&&!auth&&!sessionStorage.getItem("sw_cleaned")){sessionStorage.setItem("sw_cleaned","1");location.reload()}});
  window.addEventListener("load",function(){
   navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){
    r.update();
    document.addEventListener("visibilitychange",function(){if(!document.hidden){try{r.update()}catch(_){}}});
   }).catch(function(){});
  });
 }
}catch(e){}})();
</script>

<script>
/* v25: Netlify badge ဖျောက် (ပေါ့ပါးတဲ့ ပုံစံ)
   အရင်ဗားရှင်း: ၀.၅ စက္ကန့်တိုင်း DOM element အားလုံး + getComputedStyle စစ် → ဖုန်း Battery/CPU စားပြီး ဗီဒီယိုကြည့်စဉ် လေးစေ။
   အခု: <body>/<html> ရဲ့ တိုက်ရိုက်ကလေးတွေကိုပဲ (App ကိုယ်ပိုင် element မဟုတ်တာ) MutationObserver နဲ့ စစ်၊ ချက်ချင်းမတွေ့ရင် load ပြီးနောက် ၃ ကြိမ်သာ ထပ်စစ် */
(function(){
 var RX=/netlify/i,OWN={app:1,nav:1,sheet:1,csheet:1,toast:1,err:1,ct:1};
 function mine(e){var t=e.tagName;return t==="HEADER"||t==="MAIN"||t==="NAV"||t==="SCRIPT"||t==="STYLE"||t==="LINK"||t==="META"||t==="TITLE"||t==="HEAD"||t==="BODY"||(e.id&&OWN[e.id])}
 function bad(e){
  try{
   if(!e||e.nodeType!==1||mine(e))return false;
   var sh=e.shadowRoot;
   if(sh&&RX.test((sh.textContent||"")+(sh.innerHTML||"")))return true;
   if(e.matches&&e.matches('a[href*="netlify.com"],[data-netlify-badge],.netlify-badge'))return true;
   var cs=getComputedStyle(e);
   if(cs.position==="fixed"){
    var r=e.getBoundingClientRect();
    if(r.width<=400&&r.height<=140&&(RX.test(e.innerText||e.textContent||"")||(e.querySelector&&e.querySelector('a[href*="netlify"]'))))return true;
   }
  }catch(_){}
  return false}
 function sweep(root){
  try{var k=root.children;for(var i=k.length-1;i>=0;i--){if(bad(k[i])){try{k[i].remove()}catch(_){k[i].style.setProperty("display","none","important")}}}}catch(_){}}
 function all(){sweep(document.documentElement);if(document.body)sweep(document.body)}
 var q=0;function later(){if(q)return;q=requestAnimationFrame(function(){q=0;all()})}
 try{new MutationObserver(later).observe(document.documentElement,{childList:true});
     if(document.body)new MutationObserver(later).observe(document.body,{childList:true})}catch(_){}
 if(document.readyState!=="loading")all();else document.addEventListener("DOMContentLoaded",all);
 window.addEventListener("load",function(){all();setTimeout(all,1500);setTimeout(all,4000)});
})();
</script>
</body>
</html>
